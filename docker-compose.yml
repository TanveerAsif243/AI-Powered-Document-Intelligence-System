services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: docintel, POSTGRES_PASSWORD: docintel, POSTGRES_DB: docintel }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U docintel"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    env_file: .env
    environment: &env
      DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      INLINE_JOBS: "false"
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: ./backend
    command: celery -A app.tasks worker -l info -c 4
    env_file: .env
    environment: *env
    volumes: [uploads:/data/uploads]
    depends_on: [api, redis]
  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000", NEXT_PUBLIC_API_KEY: "${API_KEY}" }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, uploads: {} }
